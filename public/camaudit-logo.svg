<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Ambient & Drop Shadows -->
    <filter id="camaudit-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#050814" flood-opacity="0.55" />
    </filter>

    <filter id="check-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00f2fe" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.3" />
    </filter>

    <!-- Outer 'C' Ribbon Gradients -->
    <!-- Top-to-bottom main blue gradient -->
    <linearGradient id="c-ribbon-body" x1="140" y1="80" x2="380" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="20%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="78%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Upper crescent cyan highlight -->
    <linearGradient id="c-top-highlight" x1="160" y1="70" x2="390" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#7dd3fc" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Outer left purple edge glow -->
    <linearGradient id="c-purple-rim" x1="60" y1="180" x2="160" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0" />
    </linearGradient>

    <!-- Inner fold depth shadow -->
    <linearGradient id="c-inner-fold" x1="100" y1="160" x2="340" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="20%" stop-color="#0284c7" />
      <stop offset="65%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Lower tail cyan-blue gradient -->
    <linearGradient id="c-lower-tail" x1="160" y1="430" x2="430" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Camera Lens Gradients -->
    <radialGradient id="lens-outer-metal" cx="38%" cy="36%" r="65%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="25%" stop-color="#334155" />
      <stop offset="55%" stop-color="#1e293b" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="lens-inner-ring" cx="44%" cy="40%" r="58%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#1e293b" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="lens-glass-deep" cx="42%" cy="40%" r="56%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="25%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="75%" stop-color="#082f49" />
      <stop offset="95%" stop-color="#020617" />
    </radialGradient>

    <radialGradient id="lens-aperture-core" cx="48%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="65%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Glass Specular Reflections -->
    <linearGradient id="glass-specular-cyan" x1="205" y1="195" x2="300" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#7dd3fc" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glass-specular-purple" x1="290" y1="310" x2="230" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <!-- Audit Checkmark Gradients -->
    <linearGradient id="checkmark-body" x1="320" y1="280" x2="475" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="35%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="checkmark-ridge" x1="330" y1="240" x2="465" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#a5f3fc" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow Floor -->
  <ellipse cx="256" cy="454" rx="160" ry="22" fill="#0284c7" opacity="0.16" />
  <ellipse cx="256" cy="448" rx="130" ry="14" fill="#050814" opacity="0.4" />

  <g filter="url(#camaudit-shadow)">
    <!-- 1. The 3D Sweeping 'C' Ribbon Outer Shell -->
    <!-- Main Ribbon Arc -->
    <path
      d="M 374 146
         C 334 90, 264 66, 198 84
         C 122 106, 74 174, 76 256
         C 78 340, 136 414, 224 430
         C 302 444, 378 404, 414 342
         C 418 334, 418 324, 412 316
         C 406 308, 394 306, 386 312
         C 348 356, 286 382, 226 372
         C 158 360, 114 304, 116 242
         C 118 182, 154 132, 214 116
         C 264 102, 320 118, 356 158
         C 362 166, 374 168, 382 160
         C 388 154, 388 142, 374 146 Z"
      fill="url(#c-ribbon-body)"
    />

    <!-- Top Glossy Specular Surface on Ribbon -->
    <path
      d="M 198 84
         C 264 66, 334 90, 374 146
         C 382 156, 372 166, 360 158
         C 324 118, 268 102, 218 116
         C 180 126, 148 152, 132 188
         C 126 172, 138 138, 160 116
         C 172 104, 184 92, 198 84 Z"
      fill="url(#c-top-highlight)"
    />

    <!-- Outer Left Magenta/Purple Rim Light -->
    <path
      d="M 198 84
         C 122 106, 74 174, 76 256
         C 78 340, 136 414, 224 430
         C 198 420, 126 376, 102 318
         C 80 262, 86 184, 134 130
         C 152 110, 172 94, 198 84 Z"
      fill="url(#c-purple-rim)"
    />

    <!-- Inner Crescent Bevel (Depth / Chamfer inside the 'C') -->
    <path
      d="M 360 158
         C 324 118, 268 102, 218 116
         C 158 132, 122 182, 120 242
         C 118 304, 162 360, 230 372
         C 250 376, 274 374, 294 368
         C 234 364, 180 320, 172 260
         C 164 198, 198 146, 256 132
         C 294 124, 334 134, 360 158 Z"
      fill="url(#c-inner-fold)"
      opacity="0.88"
    />

    <!-- Lower Ribbon Tail -->
    <path
      d="M 224 430
         C 302 444, 378 404, 414 342
         C 418 334, 418 324, 412 316
         C 406 308, 394 306, 386 312
         C 348 356, 286 382, 226 372
         C 210 398, 218 420, 224 430 Z"
      fill="url(#c-lower-tail)"
    />

    <!-- 2. Concentric Multi-Ring Precision Camera Lens Assembly -->
    <!-- Base Outer Metal Bezel -->
    <circle cx="254" cy="254" r="98" fill="url(#lens-outer-metal)" stroke="#475569" stroke-width="2.5" />

    <!-- Mechanical Knurling Notches on Right Bezel -->
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <line x1="336" y1="212" x2="346" y2="208" />
      <line x1="344" y1="228" x2="354" y2="226" />
      <line x1="348" y1="246" x2="358" y2="246" />
      <line x1="346" y1="264" x2="356" y2="266" />
      <line x1="342" y1="282" x2="352" y2="286" />
      <line x1="334" y1="300" x2="342" y2="306" />
    </g>

    <!-- Stepped Bezel Chamfer Ring -->
    <circle cx="254" cy="254" r="86" fill="url(#lens-inner-ring)" stroke="#1e293b" stroke-width="2" />
    <circle cx="254" cy="254" r="84" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-opacity="0.4" />

    <!-- Inner Dark Metal Barrel -->
    <circle cx="254" cy="254" r="72" fill="#090d16" stroke="#0f172a" stroke-width="2" />
    <circle cx="254" cy="254" r="70" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- Optical Glass Element -->
    <circle cx="254" cy="254" r="62" fill="url(#lens-glass-deep)" />

    <!-- Optical Specular Cyan Curved Flare -->
    <path
      d="M 210 228
         A 54 54 0 0 1 292 214
         A 46 46 0 0 0 222 244 Z"
      fill="url(#glass-specular-cyan)"
    />

    <!-- Optical Violet Anti-Reflective Coating Reflection -->
    <path
      d="M 228 284
         A 50 50 0 0 0 288 272
         A 56 56 0 0 1 240 294 Z"
      fill="url(#glass-specular-purple)"
    />

    <!-- Center Camera Aperture Pupil -->
    <circle cx="256" cy="254" r="28" fill="url(#lens-aperture-core)" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6" />
    <circle cx="256" cy="254" r="16" fill="#020617" />

    <!-- High-Glint Specular Light Points -->
    <circle cx="264" cy="240" r="5.5" fill="#ffffff" filter="drop-shadow(0 0 4px #38bdf8)" />
    <circle cx="272" cy="248" r="2.5" fill="#e0f2fe" opacity="0.9" />
    <circle cx="246" cy="266" r="2" fill="#38bdf8" opacity="0.7" />

    <!-- 3. Integrated Audit Checkmark (CamAudit Brand Symbol) -->
    <!-- Glow Backing & Checkmark Body -->
    <g filter="url(#check-glow)">
      <path
        d="M 334 266
           L 376 308
           C 380 312, 386 312, 390 308
           L 468 200
           C 474 192, 472 182, 464 176
           C 456 170, 446 172, 440 180
           L 382 268
           L 358 244
           C 350 236, 338 238, 332 246
           C 326 254, 328 262, 334 266 Z"
        fill="url(#checkmark-body)"
      />

      <!-- Specular Highlight Ridge on the Checkmark -->
      <path
        d="M 342 254
           L 378 290
           L 452 188"
        stroke="url(#checkmark-ridge)"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Rounded Tip Highlights -->
      <circle cx="458" cy="184" r="3.5" fill="#ffffff" opacity="0.85" />
      <circle cx="340" cy="250" r="2.5" fill="#ffffff" opacity="0.75" />
    </g>
  </g>
</svg>
